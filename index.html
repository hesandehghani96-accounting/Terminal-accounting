<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حسابداری بازار تره‌بار</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma;background:#f3f5f8;color:#263238}
header{background:#137a50;color:white;padding:22px}
main{max-width:1100px;margin:auto;padding:18px}
.card{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 8px #ddd}
input,select,textarea{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:9px;font-size:15px}
button{border:0;border-radius:9px;padding:13px;margin:5px;background:#137a50;color:white;font-size:14px;cursor:pointer}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.menu button{min-height:65px;background:white;color:#137a50;border:1px solid #ddd;font-weight:bold}
table{width:100%;border-collapse:collapse;direction:rtl}
td,th{padding:12px;border-bottom:1px solid #ddd;text-align:right}
#app{display:none}
</style>
</head>
<body>

<header>
<h2>حسابداری بازار تره‌بار</h2>
مدیریت فروش، مشتریان و تسویه حساب
</header>

<main>
<div class="card" id="login">
<h3>ورود به سیستم</h3>
<input id="email" type="email" placeholder="ایمیل">
<input id="password" type="password" placeholder="رمز عبور">
<button onclick="login()">ورود</button>
<p id="msg"></p>
</div>

<div id="app">
<div class="card">
<h3>داشبورد حسابداری</h3>
<button onclick="logout()">خروج</button>
<div class="menu" id="menu"></div>
</div>
<div class="card">
<h3 id="title">خوش آمدید</h3>
<div id="content">یک بخش را انتخاب کنید.</div>
</div>
</div>
</main>

<script>
const SUPABASE_URL="https://vsuijzgziffkliisbqzd.supabase.co";
const SUPABASE_KEY="sb_publishable_5mNnQwwjzhAf2ZDYtralTA_3K_hvwfU";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const sections=[
["customers","مشتریان"],
["owners","صاحبان بار"],
["products","محصولات"],
["loads","بارهای ورودی"],
["invoices","فاکتورهای فروش"],
["invoice_items","جزئیات فاکتورها"],
["transactions","دریافت و پرداخت"],
["checks","چک‌ها"],
["expenses","هزینه‌ها"]
];

async function login(){
const {data,error}=await db.auth.signInWithPassword({
email:email.value,password:password.value
});
msg.innerText=error?error.message:"ورود موفق";
if(data.session) showApp();
}

async function logout(){
await db.auth.signOut();
location.reload();
}

async function showApp(){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
menu.innerHTML=sections.map(s=>
`<button onclick="openTable('${s[0]}','${s[1]}')">${s[1]}</button>`
).join("");
}

async function openTable(table,name){
title.innerText=name;
content.innerHTML="در حال دریافت اطلاعات...";
const {data,error}=await db.from(table).select("*").limit(100);
if(error){
content.innerText=error.message;
return;
}
if(!data.length){
content.innerHTML=`<p>هنوز اطلاعاتی ثبت نشده است.</p>
<button onclick="addRecord('${table}','${name}')">ثبت اطلاعات جدید</button>`;
return;
}
const keys=Object.keys(data[0]);
let html="<table><tr>"+keys.map(k=>`<th>${k}</th>`).join("")+"</tr>";
data.forEach(row=>{
html+="<tr>"+keys.map(k=>`<td>${row[k]??""}</td>`).join("")+"</tr>";
});
html+="</table>";
html+=`<button onclick="addRecord('${table}','${name}')">ثبت اطلاعات جدید</button>`;
content.innerHTML=html;
}

async function addRecord(table,name){
const {data,error}=await db.from(table).select("*").limit(1);
if(error){alert(error.message);return;}
let fields=data?.length?Object.keys(data[0]).filter(k=>
!["id","created_at"].includes(k)
):[];
if(!fields.length){
alert("ابتدا ساختار ستون‌های این جدول باید مشخص شود.");
return;
}
let values={};
for(const field of fields){
let value=prompt("مقدار "+field);
if(value===null)return;
if(value!=="")values[field]=value;
}
const {error:insertError}=await db.from(table).insert(values);
if(insertError)alert(insertError.message);
else{
alert("اطلاعات با موفقیت ثبت شد");
openTable(table,name);
}
}

db.auth.getSession().then(({data})=>{
if(data.session)showApp();
});
</script>
</body>
</html>
